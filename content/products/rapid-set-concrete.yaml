description: >-
  Rapid Set Concrete is a fast-setting pre-mixed blend designed for jobs that
  require quick turnaround times. Containing cement, sand, and aggregate, this
  mix sets in as little as 15 minutes—ideal for securing posts, clotheslines,
  letterboxes, and other non-structural applications. Simply add water and pour
  directly into the hole for a strong, reliable hold without the need for
  extensive mixing. Perfect for both DIY and trade use, it delivers speed and
  convenience without compromising on quality.
