description: >-
  Organic Garden Mix is a rich, fertile soil blend made from certified organic
  compost, designed to promote vigorous plant growth. It’s ideal for flower beds
  and general landscaping, where nutrient content is key. It is a solid material
  on its own but can also be blended with other materials to create a customised
  mix for specific applications.. This mix improves soil structure, retains
  moisture well, and supports healthy microbial activity. With its dark brown
  colour and fine texture, it’s a high-performance medium for sustainable
  gardens.
