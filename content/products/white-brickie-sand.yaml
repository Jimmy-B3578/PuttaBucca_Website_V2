description: >-
  White Brickie Sand is a light off-white fatty sand commonly used in
  bricklaying and block work where a lighter mortar colour is desired. It
  provides strong bonding strength while producing a clean, modern finish. This
  sand has excellent workability, making it ideal for trades requiring precision
  and smooth application. It can also be used in rendering or as a fine base for
  paving in decorative projects.
