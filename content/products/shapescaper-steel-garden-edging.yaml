name: ShapeScaper Steel Garden Edging
category: Edging
image: /images/products/shapescaper-steel-garden-edging/image.jpg
description: >-
  ShapeScaper steel garden edging makes borders, paths and raised beds. Each
  length is 2400mm, with connector plates and fixings, and pre-drilled so the
  joins line up. The lower profiles bend on site into curves or corners. Made
  in Australia from BlueScope steel. The yard stocks 1.6mm REDCOR weathering
  steel at 75mm, 100mm, 150mm and 185mm. REDCOR weathers to a finish equivalent
  to corten. Taller profiles up to 590mm, galvanised GALVABOND and self-healing
  ZINMAG can be ordered.
featuresAndApplications:
  - 75mm, 100mm, 150mm and 185mm high
  - 2400mm lengths, connectors supplied
  - 1.6mm REDCOR weathering steel
  - Bends on site into curves or corners
  - 100mm edging takes a 300mm ribbed stake
  - 150mm and 185mm edging take a 400mm ribbed stake
  - Garden borders, paths and raised beds
  - 10-year structural warranty from ShapeScaper
unit: per unit
