description: >-
  20mm Roadbase is a blend of crushed rock, fine particles, and aggregates,
  where the largest stones are around 20mm in size. It’s designed to compact
  tightly, creating a stable and solid surface. The mix usually includes a
  combination of crushed rock and fines which are small particles that help it
  bind. It is a durable and long lasting material.
