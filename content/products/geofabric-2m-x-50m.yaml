description: >-
  'Geofabric is a high-quality, permeable fabric roll measuring 2m x 50m, used
  for soil separation, filtration, and erosion control. It’s ideal for use
  beneath driveways, retaining walls, garden beds, and drainage trenches. The
  non-woven material allows water to pass through while preventing soil
  movement, increasing the stability and longevity of the structure. Geofabric
  is a trusted and cost-effective solution for long-term ground reinforcement in
  landscaping and civil projects.
