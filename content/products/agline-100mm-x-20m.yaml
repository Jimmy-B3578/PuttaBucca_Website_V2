description: >-
  Socked agline is a flexible, slotted drainage pipe encased in a protective
  filter sock to prevent soil and sediment from entering the pipe. This design
  ensures long-term efficiency by reducing blockages and maintaining consistent
  water flow. Commonly used behind retaining walls, in garden beds, and beneath
  turf, it is ideal for managing subsurface water and preventing waterlogging.
  Lightweight, easy to install, and highly durable, socked Agline is perfect for
  both domestic and commercial drainage projects where extra protection is
  required.
