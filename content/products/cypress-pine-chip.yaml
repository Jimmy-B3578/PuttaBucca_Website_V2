description: >-
  Cypress Pine Chip is a light brown mulch made from shredded cypress trees,
  valued for its durability and natural termite resistance. It suppresses weeds,
  retains soil moisture, and breaks down slowly, making it a long-lasting choice
  for gardens. The chip texture offers a neat, decorative finish that
  complements both native and formal landscapes. With a pleasant scent and
  natural resistance to decay, it’s a premium mulch option.
