name: ShapeScaper Stakes
category: Edging
image: /images/products/shapescaper-stakes/image.jpg
description: >-
  Stakes fix ShapeScaper garden edging into the ground. Ribbed stakes suit the
  lower edging. L-profile stakes suit the taller edging. Weathering stakes are
  REDCOR steel. Galvanised ribbed stakes, in GALVABOND, are stocked for the
  75mm and 100mm edging.
featuresAndApplications:
  - Ribbed stakes for 75mm to 185mm edging
  - L-profile stakes for 230mm to 590mm edging
  - 230mm ribbed stake for 75mm edging, weathering or galvanised
  - 300mm ribbed stake for 100mm edging, weathering or galvanised
  - 400mm ribbed stake for 150mm and 185mm edging, weathering
  - 450mm L-profile stake for 230mm edging, weathering
  - 580mm L-profile stake for 290mm edging, weathering
  - 780mm L-profile stake for 390mm edging, weathering
  - 1180mm L-profile stake for 590mm edging, weathering
unit: per unit
