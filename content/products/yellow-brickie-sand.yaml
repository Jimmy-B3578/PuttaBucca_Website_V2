name: Yellow Brickie Sand
category: Sand
image: /images/products/yellow-brickie-sand/image.jpg
description: >-
  Yellow Brickie Sand is a fatty sand used primarily for bricklaying and block
  work, where its cohesive qualities are essential for mortar. It has a rich
  yellow hue that gives mortar a warm tone, popular in heritage or rustic
  builds. Its fine texture and clay content make it sticky and easy to trowel.
  It’s also occasionally used in garden beds as part of soil conditioning or
  levelling.
